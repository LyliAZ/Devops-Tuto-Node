name: Publish Package to npmjs
on: 
  push:
    branches: jfrog-cli
jobs:
  build:
    permissions:
      id-token: write
      contents: read
      # Required for uploading code scanning.
      security-events: write
    env:
      # to set a different build name than the default one
      JFROG_CLI_BUILD_NAME: Devops-Tuto-Node-build
      # default location for sonar report
      SONAR_REPORT_TASK_FILE: ./.scannerwork/report-task.txt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up nodejs
        uses: actions/setup-node@v3
        with:
          node-version: '16' 
          
      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@v3
        env:
          cache-name: cache-node-modules
        with:
          # npm cache files are stored in `~/.npm` on Linux/macOS
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - if: ${{ steps.cache-npm.outputs.cache-hit != 'true' }}
        name: List the state of node modules
        continue-on-error: true
        run: npm list

      - name: Install dependencies
        run: npm install

      - name : run sonarqube scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: setup jfrog auth
        uses: jfrog/setup-jfrog-cli@v4          
        env:
          # JFrog Platform url
          JF_URL: ${{ vars.JF_URL }}
          # Basic authentication credentials
          JF_USER: ${{ secrets.JF_USER }}
          JF_PASSWORD: ${{ secrets.JF_PASSWORD }}
          # github token
          JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }} 

      - name: Collect SonarQube report infos
        run: |
          # create a env varibale in github that collects the task id from the scan file
          echo "SONAR_CE_TASK_ID=$(awk -F '=' '/^ceTaskId/ { print $2 }' ${SONAR_REPORT_TASK_FILE})" >> $GITHUB_ENV
          # create a env varibale in github that collects the task url from the scan file
          echo "SONAR_CE_TASK_URL=$(awk -F '=' '/^ceTaskUrl/ { print $2 }' ${SONAR_REPORT_TASK_FILE})" >> $GITHUB_ENV  
          
      - name: use jfrog cli (send all data and env variables to artifactory to be used for later)
        run: |
          # check version
          jf --version
          # Ping the server
          jf rt ping
          # get sonar report inisde the artifactory 
          # jf rt u ${SONAR_REPORT_TASK_FILE} paris-npm 
          # Collect environment variables for the build
          jf rt bce
          # Collect VCS details from git and add them to the build
          jf rt bag
          # Publish build info
          jf rt bp 
